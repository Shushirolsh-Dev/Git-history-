name: Public repository research

on:
  workflow_dispatch:
    inputs:
      daily_target:
        description: "Minimum number of new public repositories to document (at least 1000)"
        required: false
        default: "1000"
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: public-repository-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Discover and document public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GH_READ_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          DAILY_TARGET: ${{ inputs.daily_target || '1000' }}
        run: python research_public_repos.py
      - name: Commit research library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research .githistory/research-state.json
          if git diff --cached --quiet; then
            echo "No new public repositories discovered."
          else
            git commit -m "research: document public GitHub repositories"
            git push
          fi
